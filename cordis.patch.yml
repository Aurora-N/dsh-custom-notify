- insert:
    - id: notify
      name: 'dsh-custom-notify'
      config:
        approval: true
        question: true
        turnEnd: true
        error: true
        subagentApproval: false
        subagentDone: false
        when: away-session
        sound: true
        toastPosition: bottom-right
        settleMs: 1200
        coalesceMs: 1500
        language: zh
